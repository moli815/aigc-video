# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: BossAI
options:
  bundleIdPrefix: com.bossai
  deploymentTarget:
    iOS: "17.0"
targets:
  BossAI:
    type: application
    platform: iOS
    sources:
      - path: BossAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossai.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "需要语音识别权限以实现语音输入"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要麦克风权限以录制语音"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要保存生成的图片到相册"
