# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: BossAI
options:
  bundleIdPrefix: com.bossai
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.13.9

targets:
  BossAI:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftSoup
    sources:
      - path: BossAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossai.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2026100604"
        SWIFT_VERSION: "5.0"
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        # 防逆向基础：Release 构建剥离符号
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_SWIFT_SYMBOLS: YES
        COPY_PHASE_STRIP: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要选择图片以提供附件"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "需要语音识别权限以实现语音输入"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要麦克风权限以录制语音"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要保存生成的图片到相册"
        INFOPLIST_KEY_NSCameraUsageDescription: "需要相机权限以拍照后让 AI 识别"
        # 允许在「文件」App 里直接访问 App 的资料库目录
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  BossAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/BossAIiOSTests]
    dependencies:
      - target: BossAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  BossAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/BossAIUITests]
    dependencies:
      - target: BossAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  BossAI:
    build:
      targets:
        BossAI: all
        BossAITests: [test]
        BossAIUITests: [test]
    test:
      targets: [BossAITests, BossAIUITests]
