name: Build Unsigned IPA

# ─────────────────────────────────────────────────────────────
#  每次要出新包时，只需改下面这两行（把新 overlay 的地址与校验值贴进来）
# ─────────────────────────────────────────────────────────────
env:
  OVERLAY_URL: "https://litter.catbox.moe/ypg9dt.tgz"
  OVERLAY_MD5: "e1b120473e454c00534ff43e62e46ad6"

on:
  push:
    branches: [main, chatgpt-style-ui]
  workflow_dispatch:

# 同一分支只保留最新一次编译：新 run 触发时自动取消所有排队中的旧 run
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 先跑 SPM 单测（检索质量回归 + ExpertCore 回归），不过则不出包
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 历史遗留：早期图标二进制走外部镜像下发。现仓库已自包含（baseline 快照含全部资源），
      # 镜像链接过期（catbox 72h）不再阻塞构建——下载失败仅告警跳过。
      - name: Apply work overlay (optional, legacy)
        run: |
          if curl -fsSL "${{ env.OVERLAY_URL }}" -o /tmp/overlay.tgz; then
            ACTUAL=$(md5 -q /tmp/overlay.tgz)
            echo "overlay md5: $ACTUAL"
            if [ "$ACTUAL" = "${{ env.OVERLAY_MD5 }}" ]; then
              tar -xzf /tmp/overlay.tgz -C .
            else
              echo "::warning::overlay md5 mismatch, skipped"
            fi
          else
            echo "::warning::overlay unavailable (likely expired), skipped - repo is self-contained"
          fi

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Run Swift package tests
        run: swift test

  build:
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 历史遗留：仓库已自包含（baseline 快照含全部资源），镜像过期不再阻塞
      - name: Apply work overlay (optional, legacy)
        run: |
          if curl -fsSL "${{ env.OVERLAY_URL }}" -o /tmp/overlay.tgz; then
            ACTUAL=$(md5 -q /tmp/overlay.tgz)
            echo "overlay md5: $ACTUAL"
            if [ "$ACTUAL" = "${{ env.OVERLAY_MD5 }}" ]; then
              tar -xzf /tmp/overlay.tgz -C .
            else
              echo "::warning::overlay md5 mismatch, skipped"
            fi
          else
            echo "::warning::overlay unavailable (likely expired), skipped - repo is self-contained"
          fi

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project BossAI.xcodeproj \
            -scheme BossAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/BossAI.app" Payload/
          zip -r BossAI-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossAI-unsigned-ipa
          path: BossAI-unsigned.ipa
          retention-days: 30

      # 免登录取包：IPA 传临时镜像，并把直链提交回仓库（[skip ci] 防止循环构建）
      - name: Upload IPA to file mirror
        id: mirror
        run: |
          URL=$(curl -fsS --max-time 300 \
            -F "reqtype=fileupload" -F "time=72h" \
            -F "fileToUpload=@BossAI-unsigned.ipa" \
            https://litterbox.catbox.moe/resources/internals/api.php)
          echo "IPA mirror: $URL"
          echo "https://litter.catbox.moe IPA: $URL" > mirror-url.txt

      - name: Publish mirror URL to repo
        run: |
          git config user.name "ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mirror-url.txt
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore: ipa mirror url [skip ci]" && git push; fi
