name: Build Unsigned IPA

# ─────────────────────────────────────────────────────────────
#  每次要出新包时，只需改下面这两行（把新 overlay 的地址与校验值贴进来）
# ─────────────────────────────────────────────────────────────
env:
  OVERLAY_URL: "https://litter.catbox.moe/ypg9dt.tgz"
  OVERLAY_MD5: "e1b120473e454c00534ff43e62e46ad6"

on:
  push:
    branches: [main, chatgpt-style-ui]
  workflow_dispatch:

# 同一分支只保留最新一次编译：新 run 触发时自动取消所有排队中的旧 run
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 先跑 SPM 单测（检索质量回归 + ExpertCore 回归），不过则不出包
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 历史遗留：早期图标二进制走外部镜像下发。现仓库已自包含（baseline 快照含全部资源），
      # 镜像链接过期（catbox 72h）不再阻塞构建——下载失败仅告警跳过。
      - name: Apply work overlay (optional, legacy)
        run: |
          if curl -fsSL "${{ env.OVERLAY_URL }}" -o /tmp/overlay.tgz; then
            ACTUAL=$(md5 -q /tmp/overlay.tgz)
            echo "overlay md5: $ACTUAL"
            if [ "$ACTUAL" = "${{ env.OVERLAY_MD5 }}" ]; then
              tar -xzf /tmp/overlay.tgz -C .
            else
              echo "::warning::overlay md5 mismatch, skipped"
            fi
          else
            echo "::warning::overlay unavailable (likely expired), skipped - repo is self-contained"
          fi

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Run Swift package tests
        run: swift test

      # P0-46 架构门禁：单文件 >900 行告警（God File 检测），仅告警不阻断。
      # 作为重构推进度的客观标尺：拆分后此列表应逐步缩短。
      - name: Architecture gate (oversized files)
        run: |
          LONG=$(find BossAI -name "*.swift" -exec wc -l {} + | awk '$1 > 900 {printf "%5d  %s\n", $1, $2}' | sort -rn)
          if [ -n "$LONG" ]; then
            echo "::warning::超大文件（>900 行）清单："
            echo "$LONG"
          else
            echo "✅ 无超大文件（全部 ≤900 行）"
          fi

  # P0-43 iOS 单测：编译 App + BossAITests（单测 target）并执行。
  # 覆盖：配置面板档位解析 / 工具权限（云端优先）/ 图片压缩 / 远程目录映射等回归锚点。
  # 只跑单测（-only-testing:BossAITests），不跑 UI 测试（慢且易碎，另行手动执行）。
  ios-tests:
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS unit tests (BossAITests)
        run: |
          # pipefail：管道中 xcodebuild 的失败必须向上传播（此前用 | tail 吞掉了退出码）
          set -o pipefail
          xcodebuild test -project BossAI.xcodeproj \
            -scheme BossAI \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            -only-testing:BossAITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult 2>&1 | tee /tmp/ios-tests.log | tail -120

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          retention-days: 7

  build:
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 历史遗留：仓库已自包含（baseline 快照含全部资源），镜像过期不再阻塞
      - name: Apply work overlay (optional, legacy)
        run: |
          if curl -fsSL "${{ env.OVERLAY_URL }}" -o /tmp/overlay.tgz; then
            ACTUAL=$(md5 -q /tmp/overlay.tgz)
            echo "overlay md5: $ACTUAL"
            if [ "$ACTUAL" = "${{ env.OVERLAY_MD5 }}" ]; then
              tar -xzf /tmp/overlay.tgz -C .
            else
              echo "::warning::overlay md5 mismatch, skipped"
            fi
          else
            echo "::warning::overlay unavailable (likely expired), skipped - repo is self-contained"
          fi

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project BossAI.xcodeproj \
            -scheme BossAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/BossAI.app" Payload/
          zip -r BossAI-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossAI-unsigned-ipa
          path: BossAI-unsigned.ipa
          retention-days: 30

      # 免登录取包：IPA 传临时镜像，并把直链提交回仓库（[skip ci] 防止循环构建）。
      # 容错：镜像服务（litterbox）为第三方免费服务，偶发 404/限流——失败不阻塞构建，
      # GitHub Artifact 始终可用（30 天），重跑工作流即可刷新镜像链接。
      - name: Upload IPA to file mirror
        id: mirror
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            URL=$(curl -fsS --max-time 300 \
              -F "reqtype=fileupload" -F "time=72h" \
              -F "fileToUpload=@BossAI-unsigned.ipa" \
              https://litterbox.catbox.moe/resources/internals/api.php) && break
            echo "attempt $attempt failed, retrying..."; sleep 15
          done
          if [ -n "$URL" ]; then
            echo "IPA mirror: $URL"
            echo "https://litter.catbox.moe IPA: $URL" > mirror-url.txt
          else
            echo "::warning::file mirror unavailable after 3 attempts - use GitHub artifact instead"
            exit 0
          fi

      - name: Publish mirror URL to repo
        continue-on-error: true
        run: |
          if [ ! -f mirror-url.txt ]; then echo "no mirror url, skip"; exit 0; fi
          git config user.name "ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mirror-url.txt
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore: ipa mirror url [skip ci]" && git push; fi
