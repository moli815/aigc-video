name: Build Unsigned IPA
# 10-25：构建列表直接显示日期戳，不用点进去猜哪个包是哪次的
run-name: 构建 ${{ github.event.head_commit.timestamp || github.run_number }}

# ─────────────────────────────────────────────────────────────
# 三层 CI 架构中的 Release Build：
#   swift-core ─┬─→ ios-tests ─┐
#               └─→ build（候选）─┴─→ publish（发布门禁）→ 正式 IPA
#
# 并行出「候选包」、测试全过才由 publish 发布正式 Artifact：
# 既不牺牲速度（build 不必等 ios-tests），也不允许测试失败还发正式包。
#
# 10-23 CI 优化：
#  - 删除遗留 overlay 下载（仓库已自包含，原步骤只在浪费第三方请求）
#  - 删除阻塞式 catbox 镜像上传（IPA 只走 GitHub Artifact，不让第三方网盘决定 CI 何时结束）
#  - 补 saas_fix 触发分支 + paths 过滤（只改文档不再触发打包）
#  - SwiftPM 依赖缓存，减少重复下载
#  - 权限降为 contents: read（原 write 只为提交镜像链接）
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [saas_fix, main]
    paths:
      - 'BossAI/**'
      - 'Tests/**'
      - 'cloudfunctions/**'
      - 'tests-backend/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

# 同一分支只保留最新一次编译：新 run 触发时自动取消排队中的旧 run
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend and image contract regression
        run: |
          node scripts/bundle-function-shared.js
          node --check cloudfunctions/bf-api/index.js
          node --check cloudfunctions/bf-image/index.js
          node --test tests-backend/*.test.js

  # 第一道：SPM 单测（检索质量 + ExpertCore 回归），不过则不出包
  swift-core:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # GitHub macos-15 镜像已预装 Xcode 26.3；原生 Liquid Glass 需要 Xcode 26 SDK
          xcode-version: "26.3"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: macos-15-xcode-26.3-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            macos-15-xcode-26.3-spm-

      # 依赖可重复性：只允许精确版本。出现 from/branch/revision 会让全新 runner 解析到
      # 不同版本，构建结果不可比（ExyteChat 已从主 target 移除，目前仅 SwiftSoup 2.13.9）。
      - name: Dependency pin check
        run: |
          if grep -nE '^[[:space:]]+(from|branch|revision):' project.yml; then
            echo "::error::project.yml 存在非精确版本依赖，请改用 exactVersion（或提交 lockfile 方案）"
            exit 1
          fi
          echo "✅ 依赖均为精确版本"

      - name: Run Swift package tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-core-tests.log

      # P0-46 架构门禁：单文件 >900 行告警（God File 检测），仅告警不阻断。
      - name: Architecture gate (oversized files)
        run: |
          LONG=$(find BossAI -name "*.swift" -exec wc -l {} + | awk '$1 > 900 {printf "%5d  %s\n", $1, $2}' | sort -rn)
          if [ -n "$LONG" ]; then
            echo "::warning::超大文件（>900 行）清单："
            echo "$LONG"
          else
            echo "✅ 无超大文件（全部 ≤900 行）"
          fi

      - name: Upload swift log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-test-log
          path: swift-core-tests.log
          retention-days: 7

  # 第二道：iOS 单测（BossAITests）
  ios-tests:
    needs: swift-core
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            xcodegen --version
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS unit tests (BossAITests)
        run: |
          # 模拟器 fallback：GitHub runner 池偶发缺少 iPhone 16。
          DEST_NAME="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            DEST_NAME=$(xcrun simctl list devices available | grep -oE "iPhone [0-9][0-9A-Za-z ]*" | head -1 | xargs)
            echo "⚠️ iPhone 16 不可用，自动切换: ${DEST_NAME:-（无可用 iPhone）}"
          fi
          set -o pipefail
          xcodebuild test -project BossAI.xcodeproj \
            -scheme BossAI \
            -destination "platform=iOS Simulator,name=${DEST_NAME}" \
            -derivedDataPath build \
            -only-testing:BossAITests \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult 2>&1 | tee /tmp/ios-tests.log | tail -120

      # 10-25：失败时把失败用例名打出来。测试步骤只有 tail -120，失败名会被截掉，
      # 之前排查只能靠猜（白跑了两次 CI）。
      - name: Print failing tests
        if: failure()
        run: |
          echo "===== 失败用例 ====="
          grep -nE "error: -\[|' failed \(|XCTAssert|Assertion Failure" /tmp/ios-tests.log | head -60 || true

      - name: Export visual regression samples
        if: success()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path visual-qa

      - name: Upload visual regression samples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: image-design-visual-qa
          path: visual-qa
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            /tmp/ios-tests.log
          retention-days: 7

  # 第三道：候选 IPA。与 ios-tests 并行，缩短总等待；此时还不算正式产物。
  build:
    needs: [swift-core]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 10-25 用户要求：每次构建的包名带日期（北京时间），一眼分清是哪天的包。
      # 放在最前面算，保证「产物名 / 候选 artifact / 正式 artifact」三处用的是同一个戳。
      - name: Compute build stamp (Asia/Shanghai)
        run: echo "STAMP=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            xcodegen --version
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project BossAI.xcodeproj \
            -scheme BossAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | tail -120

      # 10-24：失败时把完整 build.log 传上去。
      # 之前只保留 tail -120，编译错误的诊断行被截掉，排障要靠猜（本轮就踩过）。
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/BossAI.app" Payload/
          zip -qr "BossAI-$STAMP.ipa" Payload
          ls -lh "BossAI-$STAMP.ipa"

      - name: Upload candidate IPA
        uses: actions/upload-artifact@v4
        with:
          name: BossAI-ipa-candidate-${{ env.STAMP }}
          path: BossAI-${{ env.STAMP }}.ipa
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          retention-days: 7

  # 第四道：发布门禁。只有候选包与 iOS 单测都成功，才发布正式可下载的 IPA。
  # 放在 ubuntu runner 上：只做产物搬运，不需要 macOS，几秒钟完成。
  publish:
    needs: [build, ios-tests, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 用 pattern 取候选包：名字里带日期戳，不能写死
      - name: Download candidate IPA
        uses: actions/download-artifact@v4
        with:
          pattern: BossAI-ipa-candidate-*
          path: candidate
          merge-multiple: true

      # 日期戳从候选包文件名继承（不重新取时间），保证「候选」与「正式」是同一个戳
      - name: Resolve candidate name
        run: |
          set -euo pipefail
          ls -lh candidate
          IPA=$(ls candidate/*.ipa 2>/dev/null | head -1 || true)
          test -n "$IPA" || { echo "::error::候选 IPA 缺失"; exit 1; }
          STAMP=$(basename "$IPA" .ipa | sed 's/^BossAI-//')
          test -n "$STAMP" || { echo "::error::无法从文件名解析日期戳：$IPA"; exit 1; }
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "IPA_FILE=$IPA" >> "$GITHUB_ENV"
          echo "本次构建日期戳：$STAMP"

      - name: Verify candidate
        run: |
          set -euo pipefail
          test -s "$IPA_FILE" || { echo "::error::候选 IPA 为空"; exit 1; }
          unzip -t "$IPA_FILE" > /dev/null || { echo "::error::IPA 包损坏"; exit 1; }
          echo "完整性校验通过：$IPA_FILE"

      - name: Publish official IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossAI-ipa-${{ env.STAMP }}
          path: ${{ env.IPA_FILE }}
          retention-days: 30
