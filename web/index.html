<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中防AI 管理台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#EAF1FB;
    min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 8% 0%, rgba(34,211,238,.13), transparent 55%),
               radial-gradient(130% 90% at 95% 100%, rgba(59,130,246,.16), transparent 62%),
               linear-gradient(180deg,#070B14,#0B1220);background-attachment:fixed}
  .box{position:relative;width:100%;max-width:390px;background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:32px 28px;
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 16px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10)}
  .box::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0) 42%,rgba(255,255,255,.045))}
  .logo{font-size:21px;font-weight:800;text-align:center;letter-spacing:.2px}
  .logo i{font-style:normal;background:linear-gradient(120deg,#22D3EE,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;font-size:12.5px;color:#8FA2BC;margin:7px 0 26px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:#61748F;margin-bottom:6px}
  input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:11px;
    padding:12px 14px;font-size:14.5px;color:#EAF1FB;font-family:inherit;outline:none;transition:.15s}
  input:focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
  input::placeholder{color:#61748F}
  .btn{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#22D3EE,#3B82F6);color:#04121F;
    transition:.16s;box-shadow:0 8px 24px rgba(34,211,238,.26)}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.28);color:#FCA5A5;
    border-radius:10px;padding:10px 13px;font-size:12.8px;margin-bottom:14px;line-height:1.7}
  .hide{display:none!important}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(4,18,31,.3);border-top-color:#04121F;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
    font-size:11.5px;color:#61748F;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="logo">中防AI <i>管理台</i></div>
  <div class="sub">请使用管理员或员工账号登录</div>
  <div id="err" class="err hide"></div>
  <div class="fld"><label>登录名</label><input id="u" autocomplete="username" placeholder="请输入登录名"></div>
  <div class="fld"><label>密码</label><input id="p" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
  <button class="btn" id="btn" onclick="doLogin()">登录</button>
  <div class="foot">登录后将自动进入对应的工作界面</div>
</div>

<script>
var API = "https://xmy-test-d5g8c0xcifcefcfd5-1449098021.ap-shanghai.app.tcloudbase.com/api";
var K = { token: 'bf_token', role: 'bf_role', name: 'bf_name' };

function q(id){ return document.getElementById(id); }
function showErr(m){ var e=q('err'); e.innerHTML=m; e.classList.remove('hide'); }
function busy(on){
  var b=q('btn'); b.disabled=on;
  if(on){ b._t=b.innerHTML; b.innerHTML='<span class="spin"></span>登录中'; }
  else if(b._t){ b.innerHTML=b._t; }
}

/* 已登录则直接跳转，不再要求重新输入 */
(function autoRoute(){
  try{
    var t=localStorage.getItem(K.token), r=localStorage.getItem(K.role);
    if(t && r){ location.replace(r==='admin' ? 'admin.html' : 'staff.html'); }
  }catch(e){}
})();

function doLogin(){
  var u=q('u').value.trim(), p=q('p').value;
  if(!u || !p){ showErr('请输入登录名和密码'); return; }
  q('err').classList.add('hide');
  busy(true);
  fetch(API+'/admin/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username:u, password:p })
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }); })
  .then(function(j){
    busy(false);
    if(!j.ok){ showErr(j.message || '登录失败'); return; }
    var role = (j.role === 'admin') ? 'admin' : 'staff';
    try{
      localStorage.setItem(K.token, j.token);
      localStorage.setItem(K.role, role);
      localStorage.setItem(K.name, j.displayName || '');
    }catch(e){ showErr('浏览器存储不可用，无法保持登录状态'); return; }
    location.replace(role === 'admin' ? 'admin.html' : 'staff.html');
  })
  .catch(function(){ busy(false); showErr('网络异常，请稍后重试'); });
}

q('p').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
q('u').addEventListener('keydown', function(e){ if(e.key==='Enter') q('p').focus(); });
</script>
</body>
</html>
